name: Publish Storybook

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Build Storybook
        run: pnpm --filter @meu/storybook build
      - name: Validate documentation Storybook links
        run: pnpm storybook:validate-links
      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm exec chromatic --project-token="$CHROMATIC_PROJECT_TOKEN" --storybook-build-dir=apps/storybook/storybook-static --exit-zero-on-changes
      - name: Explain skipped publish
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo "Chromatic publish skipped because CHROMATIC_PROJECT_TOKEN is not configured."
